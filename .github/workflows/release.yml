name: release

# 觸發策略：
# - push semver-style tag（v0.1.0-alpha.1 / v1.0.0 等）自動跑
# - workflow_dispatch 允許手動測試
# 不 push 到 nuget.org；只把 .nupkg / .snupkg 上傳到對應 GitHub Releases 頁面。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # softprops/action-gh-release 上傳檔到 Release 需要
  id-token: write   # actions/attest Sigstore OIDC token 需要
  attestations: write   # actions/attest 產生 attestation 需要

jobs:
  pack-and-release:
    name: Pack and upload to GitHub Releases
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MEDIAEMBEDKIT_MPV_RUNTIME_DIR: ${{ github.workspace }}\.cache\runtime
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache libmpv / yt-dlp / FFmpeg / Deno runtime
        uses: actions/cache@v5
        with:
          path: .cache\runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('docs/runtime/libmpv-git-builds.json', 'src/MediaEmbedKit.Mpv.Runtime/**.cs', 'src/MediaEmbedKit.Mpv.Externals/**.cs') }}
          restore-keys: |
            runtime-${{ runner.os }}-

      - name: Cache .NET workloads (MAUI)
        # 只 cache workload restore 真正新增到 SDK 目錄的部分；runner image 預裝
        # 的 ref/runtime/aspnetcore packs（~1.4 GB）不要再快取。packs/ 用 glob
        # 篩出 MAUI 相關 platform refs；metadata/ 只抓 workloads 子資料夾。
        # key 加 v2 後綴強制跳過先前過度涵蓋的舊快取。
        uses: actions/cache@v5
        with:
          path: |
            C:\Program Files\dotnet\sdk-manifests
            C:\Program Files\dotnet\metadata\workloads
            C:\Program Files\dotnet\packs\Microsoft.Maui.*
            C:\Program Files\dotnet\packs\Microsoft.Android.*
            C:\Program Files\dotnet\packs\Microsoft.iOS.*
            C:\Program Files\dotnet\packs\Microsoft.MacCatalyst.*
            C:\Program Files\dotnet\packs\Microsoft.tvOS.*
            C:\Program Files\dotnet\packs\Microsoft.Tizen.*
            C:\Program Files\dotnet\library-packs
            C:\Program Files\dotnet\template-packs
          key: workloads-${{ runner.os }}-${{ hashFiles('global.json') }}-maui-v2

      - name: Restore .NET workloads (MAUI)
        shell: pwsh
        run: dotnet workload restore .\MediaEmbedKit.Mpv.slnx

      - name: Run發行檢查閘門
        #發行檢查閘門內第 8 步「NuGet 套件驗證」會呼叫 Invoke-PackageValidation.ps1，
        # 它已經把 11 個可打包專案 pack 到 artifacts/packages/（含 .nupkg 與
        # .snupkg）。下一步直接拿那邊的檔上傳，不重複 dotnet pack。
        #
        # -IncludeDocSyncCheck：要求提供者下游事實宣告型文件已與 catalog 同步。
        # ci.yml（PR-CI）不開此旗標，留給 release 路徑當最後一道把關（drift 不能上正式版）。
        shell: pwsh
        run: |
          .\tools\Invoke-PreReleaseValidation.ps1 -IncludeDocSyncCheck

      - name: Generate build provenance attestations
        # actions/attest 用 GitHub OIDC token 透過 Sigstore Public Good Instance
        # 對每個 .nupkg / .snupkg 產生 build provenance attestation。Consumer 端
        # 可用 `gh attestation verify` 或 `cosign verify-blob` 驗證套件的 provenance
        # （建置來源是哪個 commit / 工作流程）。上游 mpv / FFmpeg-Builds 等第三方
        # 二進位檔尚未採用此機制；本步驟只保證
        # MediaEmbedKit.Mpv 自家 NuGet 套件的 provenance。詳見 docs/SECURITY_MODEL.md。
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          generate_release_notes: true
          fail_on_unmatched_files: true
          # tag_name 由 push tag 自動取得
