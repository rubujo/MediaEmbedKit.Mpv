name: ci

# 觸發策略（資源節約）：
# - main 的 push 與 PR 才跑（feature branch 不跑）
# - 純文件變更（*.md / docs/**）跳過
# - concurrency 取消同分支進行中的舊 run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/*/README.md'
      - 'tests/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/*/README.md'
      - 'tests/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (no GUI playback)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 把整合測試 runtime 指到 repo 內固定路徑，方便 cache hit
      MEDIAEMBEDKIT_MPV_RUNTIME_DIR: ${{ github.workspace }}\.cache\runtime
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # CI 上自動啟用 TreatWarningsAsErrors + EnforceCodeStyleInBuild
      # （Directory.Build.props 已 gate 為 ContinuousIntegrationBuild=true）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache libmpv / yt-dlp / FFmpeg / Deno runtime
        # 用 runtime catalog 與 RuntimeResolver 相關來源檔的 hash 當 cache key；
        # 來源 pin 變動時自動失效並重新下載。
        uses: actions/cache@v4
        with:
          path: .cache\runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('docs/runtime/libmpv-git-builds.json', 'src/MediaEmbedKit.Mpv/Downloads/**.cs') }}
          restore-keys: |
            runtime-${{ runner.os }}-

      - name: Run release gate
        shell: pwsh
        run: |
          .\tools\Invoke-PreReleaseValidation.ps1

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-logs
          path: |
            .tmp\**
            **\TestResults\**
          retention-days: 14
          if-no-files-found: ignore
