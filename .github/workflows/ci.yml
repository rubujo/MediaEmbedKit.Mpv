name: ci

# 觸發策略（資源節約）：
# - main 的 push 與 PR 才跑（feature branch 不跑）
# - 純文件變更（*.md / docs/**）跳過
# - concurrency 取消同分支進行中的舊 run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/*/README.md'
      - 'tests/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/*/README.md'
      - 'tests/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (no GUI 播放)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 把整合測試 runtime 指到 repo 內固定路徑，方便 cache hit
      MEDIAEMBEDKIT_MPV_RUNTIME_DIR: ${{ github.workspace }}\.cache\runtime
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # CI 上自動啟用 TreatWarningsAsErrors + EnforceCodeStyleInBuild
      # （Directory.Build.props 已 gate 為 ContinuousIntegrationBuild=true）
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache libmpv / yt-dlp / FFmpeg / Deno runtime
        # 用 runtime catalog 與實際 runtime / 下載器 來源檔的 hash 當 快取鍵值；
        # 來源 pin 或清理邏輯變動時自動失效並重新下載。
        uses: actions/cache@v5
        with:
          path: .cache\runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('docs/runtime/libmpv-git-builds.json', 'src/MediaEmbedKit.Mpv.Runtime/**.cs', 'src/MediaEmbedKit.Mpv.Externals/**.cs') }}
          restore-keys: |
            runtime-${{ runner.os }}-

      - name: Cache .NET workloads (MAUI)
        # 只 cache workload restore 真正新增到 SDK 目錄的部分；runner image 預裝
        # 的 ref/runtime/aspnetcore packs（~1.4 GB）不要再快取，避免雙倍負擔。
        # packs/ 用 glob 篩出 MAUI 相關（Maui/Android/iOS/MacCatalyst/tvOS/Tizen），
        # metadata/ 只抓 workloads 子資料夾（其他與 workload 無關）。
        # SDK 版本變動或 workload manifest 變動會自動失效；key 加 v2 後綴強制
        # 跳過先前過度涵蓋的舊快取。
        uses: actions/cache@v5
        with:
          path: |
            C:\Program Files\dotnet\sdk-manifests
            C:\Program Files\dotnet\metadata\workloads
            C:\Program Files\dotnet\packs\Microsoft.Maui.*
            C:\Program Files\dotnet\packs\Microsoft.Android.*
            C:\Program Files\dotnet\packs\Microsoft.iOS.*
            C:\Program Files\dotnet\packs\Microsoft.MacCatalyst.*
            C:\Program Files\dotnet\packs\Microsoft.tvOS.*
            C:\Program Files\dotnet\packs\Microsoft.Tizen.*
            C:\Program Files\dotnet\library-packs
            C:\Program Files\dotnet\template-packs
          key: workloads-${{ runner.os }}-${{ hashFiles('global.json') }}-maui-v2

      - name: Restore .NET workloads (MAUI)
        # actions/setup-dotnet 不會自動裝 workload；MAUI 必須顯式 restore 才能讓
        # 後續 dotnet restore / build 通過。
        shell: pwsh
        run: dotnet workload restore .\MediaEmbedKit.Mpv.slnx

      - name: Run發行檢查閘門
        shell: pwsh
        run: |
          .\tools\Invoke-PreReleaseValidation.ps1

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-logs
          path: |
            .tmp\**
            **\TestResults\**
          retention-days: 14
          if-no-files-found: ignore
