name: ci

# 觸發策略（資源節約）：
# - main 的 push 與 PR 才跑（feature branch 不跑）
# - 純文件變更（*.md / docs/**）跳過
# - concurrency 取消同分支進行中的舊 run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/*/README.md'
      - 'tests/README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'samples/*/README.md'
      - 'tests/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (no GUI 播放)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 把整合測試 runtime 指到 repo 內固定路徑，方便 cache hit
      MEDIAEMBEDKIT_MPV_RUNTIME_DIR: ${{ github.workspace }}\.cache\runtime
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # CI 上自動啟用 TreatWarningsAsErrors + EnforceCodeStyleInBuild
      # （Directory.Build.props 已 gate 為 ContinuousIntegrationBuild=true）
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache libmpv / yt-dlp / FFmpeg / Deno runtime
        # 僅在執行階段清單變更時失效。若下載器邏輯有重大調整，可手動修改尾碼 v1 進行強制失效
        uses: actions/cache@v5
        with:
          path: .cache/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('docs/runtime/libmpv-git-builds.json') }}-v1
          restore-keys: |
            runtime-${{ runner.os }}-

      - name: Restore .NET workloads (MAUI)
        # actions/setup-dotnet 不會自動安裝 workload。
        # 由於已快取 NuGet 全域目錄，此還原步驟會自動從本機快取提取套件，執行極快且無風險。
        shell: pwsh
        run: dotnet workload restore .\MediaEmbedKit.Mpv.slnx

      - name: Run發行檢查閘門
        shell: pwsh
        run: |
          .\tools\Invoke-PreReleaseValidation.ps1

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-logs
          path: |
            .tmp\**
            **\TestResults\**
          retention-days: 14
          if-no-files-found: ignore

  arm64-build-smoke:
    name: Windows ARM64 build smoke
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET workloads (MAUI)
        shell: pwsh
        run: dotnet workload restore .\MediaEmbedKit.Mpv.slnx

      - name: Restore packages
        shell: pwsh
        run: dotnet restore .\MediaEmbedKit.Mpv.slnx

      - name: Build ARM64 solution smoke
        shell: pwsh
        run: dotnet build .\MediaEmbedKit.Mpv.slnx --configuration Release --no-restore
